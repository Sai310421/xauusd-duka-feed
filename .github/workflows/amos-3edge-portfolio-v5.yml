name: AMOS 3EDGE Portfolio v5
on:
  push:
    branches: [feature/tickscalper-rawtick-v1-20260927]
    paths: ['scripts/amos_3edge_portfolio_v5.py','.github/workflows/amos-3edge-portfolio-v5.yml']
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: "nautilus/cache/exness-ticks\nnautilus/cache/exness-multisymbol", key: exness-3edge-2026-09-v1}
      - run: python3 -u scripts/amos_3edge_portfolio_v5.py
      - uses: actions/upload-artifact@v4
        with: {name: amos-3edge-portfolio-v5, path: results/amos-3edge-portfolio-v5/, retention-days: 30}
