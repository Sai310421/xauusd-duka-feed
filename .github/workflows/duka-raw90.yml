name: duka-raw90

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/duka-raw90.yml"
      - "scripts/duka_raw90.py"
      - "scripts/raw90_integrity.py"
  pull_request:
    paths:
      - ".github/workflows/duka-raw90.yml"
      - "scripts/**"
  schedule:
    - cron: "40 21 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DUKA_RAW_ROOT: ${{ github.workspace }}/.duka_raw
      DUKA_SYMBOLS: XAUUSD
      RAW_TARGET_SESSIONS: "90"

    steps:
      - name: Checkout raw feed
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore rolling raw-tick cache
        uses: actions/cache@v4
        with:
          path: .duka_raw
          key: duka-xauusd-raw-v2-${{ github.run_number }}
          restore-keys: |
            duka-xauusd-raw-v2-
            duka-xauusd-raw-v1-
          save-always: true

      - name: First pass raw90 download
        run: python -u scripts/duka_raw90.py --sessions 90 --workers 8

      - name: Repair missing weekdays pass 1
        run: python -u scripts/duka_raw90.py --sessions 90 --workers 4

      - name: Repair missing weekdays pass 2
        run: python -u scripts/duka_raw90.py --sessions 90 --workers 2

      - name: Final raw tick integrity gate
        id: integrity
        run: python -u scripts/raw90_integrity.py

      - name: Preserve missing-day and integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-raw90-integrity-${{ github.run_id }}
          path: |
            .duka_raw/XAUUSD/integrity.json
            .duka_raw/XAUUSD/download-manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve 90-session raw Bid Ask CSV dataset
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-raw-bid-ask-90sessions-${{ github.run_id }}
          path: .duka_raw/XAUUSD/*.csv
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
