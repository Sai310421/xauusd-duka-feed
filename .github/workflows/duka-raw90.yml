name: duka-raw90

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/duka-raw90.yml"
      - "scripts/**"
  schedule:
    - cron: "40 21 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DUKA_RAW_ROOT: ${{ github.workspace }}/.duka_raw
      DUKA_SYMBOLS: XAUUSD

    steps:
      - name: Checkout raw feed
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore rolling raw-tick cache
        uses: actions/cache@v4
        with:
          path: .duka_raw
          key: duka-xauusd-raw-v2-${{ github.run_number }}
          restore-keys: |
            duka-xauusd-raw-v2-
            duka-xauusd-raw-v1-
          save-always: true

      - name: First pass raw90 download
        run: python -u scripts/duka_raw90.py --days 90 --workers 8

      - name: Repair missing weekdays pass 1
        run: python -u scripts/duka_raw90.py --days 90 --workers 4

      - name: Repair missing weekdays pass 2
        run: python -u scripts/duka_raw90.py --days 90 --workers 2

      - name: Retry missing or invalid partitions only
        run: python -u scripts/repair_raw90_missing.py --days 90 --attempts 3 --delay 15

      - name: Final raw tick integrity gate
        run: python -u scripts/raw90_integrity.py

      - name: Upload raw90 integrity and repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duka-raw90-diagnostics
          path: |
            .duka_raw/*/download-manifest.json
            .duka_raw/*/repair-report.json
            .duka_raw/*/integrity.json
          if-no-files-found: warn

      - name: Checkout AMOS TripleEngine
        uses: actions/checkout@v4
        with:
          repository: Sai310421/xauusd-data
          ref: amos-tripleengine-virtualentry-v2
          path: amos-system

      - name: Install NautilusTrader
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre nautilus_trader

      - name: Run Nautilus RAW QuoteTick Virtual Entry baseline
        run: |
          python -u amos-system/amos_triple_engine_v2/nautilus_raw90_runner.py             --raw-root "${DUKA_RAW_ROOT}/XAUUSD"             --days 90             --out amos-system/amos_triple_engine_v2/nautilus_raw90_kpi.json

      - name: Normalize Nautilus EDGE evidence (fail closed)
        if: always()
        run: |
          mkdir -p artifacts/edge
          if test -f amos-system/amos_triple_engine_v2/nautilus_raw90_kpi.json; then
            python scripts/edge_result_gate.py --input amos-system/amos_triple_engine_v2/nautilus_raw90_kpi.json --output artifacts/edge/nautilus_raw90_evidence.json
          else
            printf '%s\n' '{"status":"INCOMPLETE","reason":"NAUTILUS_KPI_MISSING","eligible_for_promotion":false}' > artifacts/edge/nautilus_raw90_evidence.json
          fi

      - name: Upload standardized EDGE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amos-edge-evidence
          path: artifacts/edge/nautilus_raw90_evidence.json
          if-no-files-found: error

      - name: Upload AMOS Nautilus raw90 KPI
        uses: actions/upload-artifact@v4
        with:
          name: amos-tripleengine-nautilus-raw90-kpi
          path: amos-system/amos_triple_engine_v2/nautilus_raw90_kpi.json
          if-no-files-found: error
