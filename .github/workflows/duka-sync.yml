name: duka-sync\n# tickscalper rawtick v1 rerun

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [duka-sync]
  push:
    paths:
      - ".github/workflows/duka-sync.yml"
      - "scripts/duka_sync.py"
      - "scripts/tickscalper_rawtick_ab.py"

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: TickScalper Raw Tick A0-B3
        if: github.ref == 'refs/heads/feature/tickscalper-rawtick-v1-20260927'
        env:
          RAW_START: '2026-09-21'
          RAW_END: '2026-09-25'
          RAW_HOUR_START: '7'
          RAW_HOUR_END: '18'
        run: python3 -u scripts/tickscalper_rawtick_ab.py

      - name: Upload TickScalper Raw Tick result
        if: github.ref == 'refs/heads/feature/tickscalper-rawtick-v1-20260927'
        uses: actions/upload-artifact@v4
        with:
          name: tickscalper-rawtick-v1
          path: results/tickscalper-rawtick-v1/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            nautilus/cache/duka
            nautilus/cache/github
          key: duka-${{ github.run_id }}
          restore-keys: |
            duka-

      - name: Fill next M1 gaps
        if: github.ref == 'refs/heads/main'
        run: python3 -u scripts/duka_sync.py

      - name: Commit books if coverage moved
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "duka-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/
          if git diff --staged --quiet; then
            echo "no book changes"
            exit 0
          fi
          DAYS=$(python3 -c "import json; print(json.load(open('books/duka-sync.json'))['m1_days_cached'])")
          WANT=$(python3 -c "import json; print(json.load(open('books/duka-sync.json'))['m1_days_wanted'])")
          git commit -m "feed: M1 ${DAYS}/${WANT}"
          git push
