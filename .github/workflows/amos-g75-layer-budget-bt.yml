name: AMOS G75 Layer Budget BT

on:
  push:
    branches: [feature/tickscalper-rawtick-v1-20260927]
    paths:
      - "scripts/amos_g75_layer_budget_bt.py"
      - ".github/workflows/amos-g75-layer-budget-bt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: nautilus/cache/exness-ticks
          key: exness-xauusd-2026-09-v1
          restore-keys: |
            exness-xauusd-
      - run: python3 -u scripts/amos_g75_layer_budget_bt.py
      - uses: actions/upload-artifact@v4
        with:
          name: amos-g75-layer-budget-bt
          path: results/amos-g75-layer-budget/
          if-no-files-found: error
          retention-days: 30
