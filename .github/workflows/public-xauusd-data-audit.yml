name: public-xauusd-data-audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/public-xauusd-data-audit.yml"
      - "scripts/public_xauusd_audit.py"
  schedule:
    - cron: "20 4 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Parquet reader
        run: python -m pip install pyarrow
      - name: Download and validate public XAUUSD sample
        run: python -u scripts/public_xauusd_audit.py
      - name: Upload audit and sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-xauusd-sample-audit
          path: artifacts/public_xauusd/
          if-no-files-found: warn
          retention-days: 7
