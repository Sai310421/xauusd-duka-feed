name: AMOS Diverse EDGE Factory v4
on:
  push:
    branches: [feature/tickscalper-rawtick-v1-20260927]
    paths: ['scripts/amos_diverse_edge_factory_v4.py','.github/workflows/amos-diverse-edge-factory-v4.yml']
  workflow_dispatch:
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: nautilus/cache/exness-multisymbol
          key: exness-multisymbol-zero-2026-09-v1
      - run: python3 -u scripts/amos_diverse_edge_factory_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: amos-diverse-edge-factory-v4
          path: results/amos-diverse-edge-factory-v4/
          retention-days: 30
