name: Exness TickScalper Replay

on:
  push:
    branches: [feature/tickscalper-rawtick-v1-20260927]
    paths:
      - "scripts/exness_tickscalper_replay.py"
      - ".github/workflows/exness-tickscalper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore Exness tick cache
        uses: actions/cache@v4
        with:
          path: nautilus/cache/exness-ticks
          key: exness-xauusd-2026-09-v1
          restore-keys: |
            exness-xauusd-
      - name: Run Exness Raw/Zero replay
        run: python3 -u scripts/exness_tickscalper_replay.py
      - name: Upload Exness replay
        uses: actions/upload-artifact@v4
        with:
          name: exness-tickscalper-replay
          path: results/exness-tickscalper/
          if-no-files-found: error
          retention-days: 30
