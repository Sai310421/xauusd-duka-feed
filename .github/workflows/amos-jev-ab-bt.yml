name: AMOS JEV A-B Raw Tick BT

on:
  push:
    branches: [feature/tickscalper-rawtick-v1-20260927]
    paths:
      - "scripts/amos_jev_ab_off_bt.py"
      - ".github/workflows/amos-jev-ab-bt.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jev-off:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: nautilus/cache/exness-ticks
          key: exness-xauusd-2026-09-v1
          restore-keys: |
            exness-xauusd-
      - run: python3 -u scripts/amos_jev_ab_off_bt.py
      - uses: actions/upload-artifact@v4
        with:
          name: amos-jev-off-bt
          path: results/amos-jev-ab-bt/
          if-no-files-found: error
          retention-days: 30

  jev-credential-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check real Jev credentials without exposing values
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          mkdir -p results/jev-credential-check
          if [ -n "$TYPESAFE_API_KEY" ]; then
            echo '{"provider":"typesafe","real_jev_ready":true}' > results/jev-credential-check/status.json
          elif [ -n "$AI_GATEWAY_API_KEY" ]; then
            echo '{"provider":"gateway","real_jev_ready":true}' > results/jev-credential-check/status.json
          else
            echo '{"provider":null,"real_jev_ready":false,"reason":"No TYPESAFE_API_KEY or AI_GATEWAY_API_KEY GitHub secret"}' > results/jev-credential-check/status.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jev-credential-check
          path: results/jev-credential-check/status.json
          retention-days: 30
